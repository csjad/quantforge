[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "0.1.0"
description = "Local A-share multi-strategy backtesting engine with per-trade conservation verification. Zero third-party dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantForge Authors" }]
keywords = ["quant", "backtesting", "a-share", "china-stocks", "conservation-laws"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
qf = "qf.cli:main"
qf-console = "qf.webconsole:main"

[tool.setuptools.packages.find]
where = ["src"]
